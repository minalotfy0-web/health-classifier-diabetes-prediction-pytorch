name: tuned
seed: 974
data_path: ../data/diabetes.csv
test_size: 0.2
val_size: 0.1
zero_as_missing:
- Glucose
- BloodPressure
- SkinThickness
- Insulin
- BMI
missing_indicators: true
log_transform:
- Insulin
- DiabetesPedigreeFunction
- Age
hidden_sizes:
- 128
dropout: 0.2567998868214429
dropout_layers: null
batch_norm: true
optimizer: adamw
learning_rate: 0.0028957411603313587
weight_decay: 0.0013738095985112633
batch_size: 64
max_epochs: 1000
patience: 100
lr_scheduler: true
pos_weight: auto
log_every: 100
threshold: f1
ensemble_size: 5
models:
- nn
- logistic_regression
- random_forest
- gradient_boosting
- nn+gradient_boosting
cv_folds: 5
cv_repeats: 5
output_dir: ../results
