# Improved setup. Relative paths are resolved against this file's folder; the config
# name defaults to the file name. Any value can be overridden from the command line.

seed: 974
data_path: ../data/diabetes.csv
test_size: 0.2   # fraction of all samples held out for the final evaluation
val_size: 0.1    # fraction of all samples used for early stopping and threshold tuning

# Preprocessing (fitted on the training set only)
zero_as_missing: [Glucose, BloodPressure, SkinThickness, Insulin, BMI]  # 0 = not measured
missing_indicators: true    # add a <column>_missing flag for each of those columns
log_transform: [Insulin, DiabetesPedigreeFunction, Age]

# Network
hidden_sizes: [32, 16]
dropout: 0.2
dropout_layers: null        # null = dropout after every hidden layer
batch_norm: false

# Training
optimizer: adamw            # adamw or sgd
learning_rate: 0.001
weight_decay: 0.0001
batch_size: 32              # null = full batch
max_epochs: 1000
patience: 100               # early stopping; null = always train max_epochs
lr_scheduler: true          # halve the learning rate when validation loss plateaus
pos_weight: auto            # weight positives by #negatives / #positives; null = unweighted
log_every: 100

# Decision
threshold: f1               # f1 or youden (tuned on the validation set), or a fixed probability
ensemble_size: 5            # networks trained with different seeds, probabilities averaged

# Models compared in cross-validation and on the test set (the first one is the primary model)
models: [nn, logistic_regression, random_forest, gradient_boosting, nn+gradient_boosting]

# Repeated stratified k-fold cross-validation on the development set (test set excluded)
cv_folds: 5
cv_repeats: 5

output_dir: ../results
