# Experiment configuration. Relative paths are resolved against this file's folder.
# Any value can be overridden from the command line (see `python -m diabetes_classifier --help`).

seed: 974

# Data
data_path: data/diabetes.csv
test_size: 0.2   # fraction of all samples held out for the final evaluation
val_size: 0.1    # fraction of all samples used to select the best epoch

# Model: one ReLU layer per entry in hidden_sizes; dropout follows the listed layer indices
hidden_sizes: [8, 16, 32, 16, 8]
dropout: 0.5
dropout_layers: [3]

# Training (full-batch SGD)
epochs: 7000
learning_rate: 0.01
log_every: 500

# Output
output_dir: results
