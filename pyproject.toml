[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetes-classifier"
version = "2.0.0"
description = "Diabetes prediction on the Pima Indians Diabetes dataset with a PyTorch neural network"
readme = "README.md"
license = "MIT"
authors = [{ name = "Mina Lotfy Saad Gergis" }]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "PyYAML",
    "optuna",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
diabetes-classifier = "diabetes_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
