name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact command(s) you ran, ideally starting from a fresh install.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or traceback
      render: text
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / Ubuntu 24.04 / macOS 15
    validations:
      required: true
  - type: input
    id: torch
    attributes:
      label: PyTorch version
      placeholder: "2.15.0"
