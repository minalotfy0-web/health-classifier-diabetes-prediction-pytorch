name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install pinned requirements (tested versions, 3.13 only)
        if: matrix.python-version == '3.13'
        run: pip install -r requirements.txt

      - name: Install package
        run: pip install -e ".[dev,web]"

      - name: Lint
        if: matrix.python-version == '3.13'
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest

      - name: Smoke-run the CLI
        run: |
          python -m diabetes_classifier cv --max-epochs 20 --cv-folds 2 --cv-repeats 1 --output-dir /tmp/smoke
          python -m diabetes_classifier train --max-epochs 20 --output-dir /tmp/smoke
          python -m diabetes_classifier predict --model /tmp/smoke/default/model.joblib --glucose 148 --age 50 --pedigree 0.627
          python -m diabetes_classifier predict --glucose 148 --age 50 --pedigree 0.627
