name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest

      - name: Smoke-run the CLI
        run: |
          python -m diabetes_classifier cv --max-epochs 20 --cv-folds 2 --cv-repeats 1 --output-dir /tmp/smoke
          python -m diabetes_classifier train --max-epochs 20 --output-dir /tmp/smoke
          python -m diabetes_classifier predict --model /tmp/smoke/default/model.joblib --glucose 148 --age 50 --pedigree 0.627
          python -m diabetes_classifier predict --glucose 148 --age 50 --pedigree 0.627
